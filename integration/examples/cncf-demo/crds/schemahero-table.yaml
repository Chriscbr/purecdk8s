# Source: https://github.com/vfarcic/cncf-demo/tree/main/cdk8s/crds/schemahero-table.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tables.schemas.schemahero.io
spec:
  group: schemas.schemahero.io
  names:
    kind: Table
    plural: tables
    singular: table
  scope: Namespaced
  versions:
    - name: v1alpha4
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                database:
                  type: string
                name:
                  type: string
                schema:
                  type: object
                  properties:
                    postgres:
                      type: object
                      properties:
                        primaryKey:
                          type: array
                          items:
                            type: string
                        columns:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              type:
                                type: string
                              constraints:
                                type: object
                                properties:
                                  notNull:
                                    type: boolean

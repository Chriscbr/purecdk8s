apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: externalsecrets.external-secrets.io
spec:
  group: external-secrets.io
  names:
    kind: ExternalSecret
    plural: externalsecrets
    singular: externalsecret
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                refreshInterval:
                  type: string
                secretStoreRef:
                  type: object
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                target:
                  type: object
                  properties:
                    name:
                      type: string
                    creationPolicy:
                      type: string
                dataFrom:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
